<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manhattanhenge Simulation</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #222; color: white; }
    canvas { background: #444; display: block; margin: 20px auto; }
    button { margin: 10px; padding: 10px 20px; font-size: 16px; }
  </style>
</head>
<body>
  <h1>Manhattanhenge Simulation</h1>
  <canvas id="simCanvas" width="600" height="300"></canvas>
  <div>
    <button onclick="togglePause()" id="pauseBtn">Pause</button>
    <button onclick="restartSim()">Restart</button>
  </div>
  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    let t = 0;
    let paused = false;
    let animationFrame;

    const startTime = 20 + (12 / 60); 
    const endTime = 22;  
    const streetNames = ["14th Ave", "15th Ave", "16th Ave", "17th Ave", "18th Ave", "19th Ave", "20th Ave", "21st Ave", "22nd Ave", "23rd Ave", "24th Ave"];

    function drawStreetGrid() {
      ctx.fillStyle = '#222';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';

      let i = 0;
      for (let x = 0; x < canvas.width; x += 60) {
        ctx.fillRect(x, 0, 20, canvas.height);

        const percent = x / canvas.width;
        const time = startTime + percent * (endTime - startTime);
        let hours = Math.floor(time);
        const minutes = Math.round((time - hours) * 60);
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        if (hours === 0) hours = 12;
        const label = `${hours}:${minutes.toString().padStart(2, '0')} ${ampm}`;
        ctx.fillStyle = 'white';
        ctx.fillText(label, x + 10, canvas.height - 35);

        const street = streetNames[i % streetNames.length];
        ctx.fillText(street, x + 10, canvas.height - 20);
        ctx.fillStyle = '#222';
        i++;
      }
    }

    function drawSun(x, y) {
      ctx.beginPath();
      ctx.arc(x, y, 20, 0, Math.PI * 2);
      ctx.fillStyle = '#FDB813';
      ctx.fill();
      ctx.closePath();
    }

    function drawAlignmentEffect(x) {
      if (x > 260 && x < 340) {
        ctx.fillStyle = 'rgba(255, 215, 0, 0.2)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
    }

    function draw(x, y) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawStreetGrid();
      drawAlignmentEffect(x);
      drawSun(x, y);
    }

    function update() {
      if (!paused) {
        t += 0.003; 
        if (t > 1) t = 0;
      }

      const x = t * canvas.width;
      const y = canvas.height - 30 - Math.sin(Math.PI * t) * 150;

      draw(x, y);
      animationFrame = requestAnimationFrame(update);
    }

    function togglePause() {
      paused = !paused;
      document.getElementById('pauseBtn').textContent = paused ? 'Resume' : 'Pause';
    }

    function restartSim() {
      t = 0;
      paused = false;
      document.getElementById('pauseBtn').textContent = 'Pause';
    }

    update();
  </script>
  <img src="Screenshot from 2025-05-01 06-22-52.png" alt="map">
  <p>By: DefaultPi and Euphonical2</p>
</body>
</html>
